{% load static %}
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__brand" href="{% url 'core:home' %}" aria-label="{{ site_settings.company_name|default:'Al Bahaa Contracting' }} home">
      {% if site_settings.header_logo %}
      <img class="site-header__logo" src="{{ site_settings.header_logo.url }}" alt="{{ site_settings.company_name|default:'Al Bahaa Contracting' }}">
      {% else %}
      <img class="site-header__logo" src="{% static 'img/branding/AlBahaa logo.svg' %}" alt="{{ site_settings.company_name|default:'Al Bahaa Contracting' }}">
      {% endif %}
    </a>
    <button class="site-header__menu-toggle" type="button" aria-controls="primary-navigation" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
      <span class="site-header__menu-label">Menu</span>
    </button>
    <nav class="site-header__nav" id="primary-navigation" aria-label="Primary navigation">
      <a href="{% url 'core:home' %}" {% if request.resolver_match.url_name == 'home' %}class="active"{% endif %}>Home</a>
      <a href="{% url 'core:about' %}" {% if request.resolver_match.url_name == 'about' %}class="active"{% endif %}>About Us</a>
      <a href="{% url 'projects:list' %}" {% if request.resolver_match.app_name == 'projects' %}class="active"{% endif %}>Projects</a>
      <a href="{% url 'news:list' %}" {% if request.resolver_match.app_name == 'news' %}class="active"{% endif %}>News</a>
      <a href="{% url 'core:careers' %}" {% if request.resolver_match.url_name == 'careers' or request.resolver_match.url_name == 'job_detail' %}class="active"{% endif %}>Careers</a>
      <a href="{% url 'core:contact' %}" {% if request.resolver_match.url_name == 'contact' %}class="active"{% endif %}>Contact Us</a>
    </nav>
  </div>
</header>

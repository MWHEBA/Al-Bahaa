{% load static %}
<div class="client-showcase" aria-label="Trusted Partners and Clients">
  <div class="client-showcase__header">
    <p class="client-showcase__label">{{ label|default:"TRUSTED BY INDUSTRY LEADERS &amp; INSTITUTIONAL PARTNERS" }}</p>
  </div>
  <div class="client-showcase__marquee">
    <div class="client-showcase__track">
      <div class="client-showcase__group">
        {% if clients %}
          {% for client in clients %}
            <div class="client-showcase__item">
              <img src="{{ client.image_url }}" alt="{{ client.name }}" loading="lazy" decoding="async">
            </div>
          {% endfor %}
        {% else %}
          <div class="client-showcase__item"><img src="{% static 'img/clients/Layer 1.webp' %}" alt="Institutional Engineering Partner" loading="lazy" decoding="async"></div>
          <div class="client-showcase__item"><img src="{% static 'img/clients/Layer 2.webp' %}" alt="Commercial Development Partner" loading="lazy" decoding="async"></div>
          <div class="client-showcase__item"><img src="{% static 'img/clients/Layer 3.webp' %}" alt="Infrastructure Sector Client" loading="lazy" decoding="async"></div>
          <div class="client-showcase__item"><img src="{% static 'img/clients/Layer 4.webp' %}" alt="Corporate Enterprise Client" loading="lazy" decoding="async"></div>
          <div class="client-showcase__item"><img src="{% static 'img/clients/Layer 5.webp' %}" alt="Industrial Construction Partner" loading="lazy" decoding="async"></div>
          <div class="client-showcase__item"><img src="{% static 'img/clients/Layer 6.webp' %}" alt="Municipal Contracting Client" loading="lazy" decoding="async"></div>
          <div class="client-showcase__item"><img src="{% static 'img/clients/l3.webp' %}" alt="Engineering Development Authority" loading="lazy" decoding="async"></div>
          <div class="client-showcase__item"><img src="{% static 'img/clients/logo_partner-3.webp' %}" alt="Urban Infrastructure Partner" loading="lazy" decoding="async"></div>
          <div class="client-showcase__item"><img src="{% static 'img/clients/11.webp' %}" alt="Contracting Federation Associate" loading="lazy" decoding="async"></div>
          <div class="client-showcase__item"><img src="{% static 'img/clients/logo_partner-8.webp' %}" alt="Corporate Architectural Client" loading="lazy" decoding="async"></div>
          <div class="client-showcase__item"><img src="{% static 'img/clients/l4.webp' %}" alt="Specialized Finishing Partner" loading="lazy" decoding="async"></div>
          <div class="client-showcase__item"><img src="{% static 'img/clients/Layer 1 copy.webp' %}" alt="Infrastructure Network Client" loading="lazy" decoding="async"></div>
        {% endif %}
      </div>
      <div class="client-showcase__group" aria-hidden="true">
        {% if clients %}
          {% for client in clients %}
            <div class="client-showcase__item">
              <img src="{{ client.image_url }}" alt="{{ client.name }}" loading="lazy" decoding="async">
            </div>
          {% endfor %}
        {% else %}
          <div class="client-showcase__item"><img src="{% static 'img/clients/Layer 1.webp' %}" alt="Institutional Engineering Partner" loading="lazy" decoding="async"></div>
          <div class="client-showcase__item"><img src="{% static 'img/clients/Layer 2.webp' %}" alt="Commercial Development Partner" loading="lazy" decoding="async"></div>
          <div class="client-showcase__item"><img src="{% static 'img/clients/Layer 3.webp' %}" alt="Infrastructure Sector Client" loading="lazy" decoding="async"></div>
          <div class="client-showcase__item"><img src="{% static 'img/clients/Layer 4.webp' %}" alt="Corporate Enterprise Client" loading="lazy" decoding="async"></div>
          <div class="client-showcase__item"><img src="{% static 'img/clients/Layer 5.webp' %}" alt="Industrial Construction Partner" loading="lazy" decoding="async"></div>
          <div class="client-showcase__item"><img src="{% static 'img/clients/Layer 6.webp' %}" alt="Municipal Contracting Client" loading="lazy" decoding="async"></div>
          <div class="client-showcase__item"><img src="{% static 'img/clients/l3.webp' %}" alt="Engineering Development Authority" loading="lazy" decoding="async"></div>
          <div class="client-showcase__item"><img src="{% static 'img/clients/logo_partner-3.webp' %}" alt="Urban Infrastructure Partner" loading="lazy" decoding="async"></div>
          <div class="client-showcase__item"><img src="{% static 'img/clients/11.webp' %}" alt="Contracting Federation Associate" loading="lazy" decoding="async"></div>
          <div class="client-showcase__item"><img src="{% static 'img/clients/logo_partner-8.webp' %}" alt="Corporate Architectural Client" loading="lazy" decoding="async"></div>
          <div class="client-showcase__item"><img src="{% static 'img/clients/l4.webp' %}" alt="Specialized Finishing Partner" loading="lazy" decoding="async"></div>
          <div class="client-showcase__item"><img src="{% static 'img/clients/Layer 1 copy.webp' %}" alt="Infrastructure Network Client" loading="lazy" decoding="async"></div>
        {% endif %}
      </div>
    </div>
  </div>
</div>
